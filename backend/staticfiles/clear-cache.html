<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing Cache - ZimAI Trader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 16px;
        }
        p {
            color: #9ca3af;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .success {
            color: #34d399;
            font-weight: 500;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        .steps {
            text-align: left;
            margin-top: 24px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 14px;
        }
        .steps li {
            color: #9ca3af;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1>Clearing Application Cache</h1>
        <p id="status">Please wait while we clear your browser cache...</p>
        <div id="completion" style="display: none;">
            <p class="success">✓ Cache cleared successfully!</p>
            <button onclick="redirectHome()">Go to Homepage</button>
        </div>
        <div class="steps">
            <strong style="color: #e5e7eb;">What we're doing:</strong>
            <ul style="margin-top: 8px; margin-left: 20px;">
                <li id="step1">Clearing localStorage...</li>
                <li id="step2">Clearing sessionStorage...</li>
                <li id="step3">Unregistering service workers...</li>
                <li id="step4">Clearing cache storage...</li>
            </ul>
        </div>
    </div>

    <script>
        async function clearAllCaches() {
            const statusEl = document.getElementById('status');
            const spinnerEl = document.getElementById('spinner');
            const completionEl = document.getElementById('completion');
            
            try {
                const step1 = document.getElementById('step1');
                localStorage.clear();
                step1.innerHTML = '✓ localStorage cleared';
                step1.style.color = '#34d399';
                await sleep(500);

                const step2 = document.getElementById('step2');
                sessionStorage.clear();
                step2.innerHTML = '✓ sessionStorage cleared';
                step2.style.color = '#34d399';
                await sleep(500);

                const step3 = document.getElementById('step3');
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                    step3.innerHTML = `✓ Unregistered ${registrations.length} service worker(s)`;
                } else {
                    step3.innerHTML = '✓ No service workers found';
                }
                step3.style.color = '#34d399';
                await sleep(500);

                const step4 = document.getElementById('step4');
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                    step4.innerHTML = `✓ Deleted ${cacheNames.length} cache(s)`;
                } else {
                    step4.innerHTML = '✓ No cache storage found';
                }
                step4.style.color = '#34d399';
                await sleep(500);

                spinnerEl.style.display = 'none';
                statusEl.style.display = 'none';
                completionEl.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
                
            } catch (error) {
                console.error('Error clearing caches:', error);
                statusEl.innerHTML = '<span style="color: #f87171;">Error: ' + error.message + '</span>';
                spinnerEl.style.display = 'none';
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function redirectHome() {
            window.location.href = '/';
        }

        clearAllCaches();
    </script>
</body>
</html>
