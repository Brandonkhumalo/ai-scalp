version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema:
      - "../backend/api/migrations"
      - "../backend/accounts/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/store/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
